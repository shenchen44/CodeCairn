[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecairn"
version = "0.4.1"
description = "Evidence capture and review for AI-assisted code changes"
readme = "README-en.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.11.2",
    "pydantic-settings==2.8.1",
    "httpx==0.28.1",
    "PyJWT==2.10.1",
    "PyYAML==6.0.2",
    "cryptography==44.0.2",
    "Pillow==11.3.0",
]

[project.scripts]
cairn = "codecairn.cli:main"
codecairn = "codecairn.cli:main"

[tool.setuptools.packages.find]
include = ["codecairn*"]
